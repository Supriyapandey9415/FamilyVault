application:
  security:
    jwt:
      # Public fixture used only by isolated H2 tests. Never use for an application run.
      secret-key: dGVzdC1vbmx5LXNpZ25pbmcta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0wMQ==
      expiration: 3600000
      vault-expiration: 600000
logging:
  level:
    root: WARN
    org.hibernate.SQL: WARN
app:
  storage:
    type: local
    root: target/test-storage
spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
