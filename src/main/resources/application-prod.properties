# Production profile. Supply secrets through the deployment platform's environment variables.

# Server and public frontend
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.shutdown=graceful
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Production DB_URL must use authenticated TLS, e.g. jdbc:mysql://host:3306/familyvault?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}

# Database schema and logging
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# SMTP. For Gmail, SMTP_PASSWORD must be a Google App Password.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT_MS:20000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:20000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT_MS:20000}

# Sign in with Apple. Keep the .p8 key outside the application image and mount it as a secret.
application.security.oauth2.apple.enabled=${APPLE_SIGN_IN_ENABLED:false}
application.security.oauth2.apple.client-id=${APPLE_CLIENT_ID:}
application.security.oauth2.apple.team-id=${APPLE_TEAM_ID:}
application.security.oauth2.apple.key-id=${APPLE_KEY_ID:}
application.security.oauth2.apple.private-key-path=${APPLE_PRIVATE_KEY_PATH:}
application.security.oauth2.apple.private-key-base64=${APPLE_PRIVATE_KEY_BASE64:}
application.security.oauth2.apple.redirect-uri=${APPLE_REDIRECT_URI:}

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent}
gemini.api.connect-timeout=${GEMINI_CONNECT_TIMEOUT:5s}
gemini.api.read-timeout=${GEMINI_READ_TIMEOUT:90s}

# JWT - provide a strong Base64-encoded secret in production
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
application.security.jwt.vault-expiration=${VAULT_TOKEN_EXPIRATION_MS:600000}

# Container storage. Mount a persistent disk/volume at /app/uploads.
app.storage.type=${FILE_STORAGE_TYPE:local}
app.storage.root=${FILE_STORAGE_ROOT:/app/uploads}

# Comma-separated account emails allowed to manage platform-only settings such as SMTP.
app.platform-admin-emails=${PLATFORM_ADMIN_EMAILS:}
app.secrets.encryption-key=${SMTP_CONFIG_ENCRYPTION_KEY:}
app.auth-cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth-cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Upload limits can be lowered by the deployment environment when needed.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:30MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:30MB}
