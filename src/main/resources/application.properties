# ===================================================================
# Spring Boot Mail - Gmail SMTP Configuration
# ===================================================================
# Supply SMTP_USERNAME and SMTP_PASSWORD through environment variables.
# For Gmail, SMTP_PASSWORD must be a Google App Password rather than the account password.
# ===================================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Gemini API configuration. Keep the real key in an environment variable.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent}
gemini.api.connect-timeout=${GEMINI_CONNECT_TIMEOUT:5s}
gemini.api.read-timeout=${GEMINI_READ_TIMEOUT:90s}
